name: Build APK dan tes

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL API (https://... untuk produksi; http://10.0.2.2:3000 hanya untuk emulator)"
        required: true
        default: "http://10.0.2.2:3000"
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xyinncht
          POSTGRES_PASSWORD: xyinncht
          POSTGRES_DB: xyinncht_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xyinncht"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pasang dependensi API
        run: npm install -w apps/api
      - name: Tes unit API
        working-directory: apps/api
        run: npm run test:unit
      - name: Tes integrasi API (Postgres)
        working-directory: apps/api
        run: |
          cp .env.test.example .env.test
          npm run test:integration
      - name: Tes logika mobile (tema, pesan)
        working-directory: apps/mobile
        run: node --test "test/*.test.js"

  apk:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ inputs.api_url || vars.API_URL || 'http://10.0.2.2:3000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Tes logika mobile (gerbang sebelum build)
        working-directory: apps/mobile
        run: node --test "test/*.test.js"
      - name: Pasang Expo dan dependensi yang cocok versinya
        working-directory: apps/mobile
        run: |
          npm install expo@latest
          npx expo install expo-router react react-native react-native-screens react-native-safe-area-context \
            expo-linking expo-status-bar expo-constants expo-secure-store expo-blur expo-linear-gradient expo-font \
            expo-image-picker expo-image-manipulator expo-notifications expo-device expo-build-properties \
            @react-native-async-storage/async-storage react-native-svg @expo/vector-icons \
            @expo-google-fonts/manrope @expo-google-fonts/plus-jakarta-sans @expo-google-fonts/nunito \
            @expo-google-fonts/ibm-plex-sans @expo-google-fonts/lora
          npm install -D typescript @types/react
          npx expo install --fix
      - name: Pasang URL API ke app.json
        working-directory: apps/mobile
        run: |
          node -e "
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const url = process.env.API_URL;
          j.expo.extra.apiUrl = url;
          if (url.startsWith('http://')) {
            j.expo.plugins.push(['expo-build-properties', { android: { usesCleartextTraffic: true } }]);
            console.log('PERINGATAN: API memakai http://, lalu lintas tidak terenkripsi diizinkan. Pakai https di produksi.');
          }
          fs.writeFileSync('app.json', JSON.stringify(j, null, 2));
          console.log('apiUrl =', url);
          "
      - name: Cek tipe TypeScript (tidak memblokir build, lihat lognya)
        working-directory: apps/mobile
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Buat proyek Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build APK release
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: xyinncht-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
