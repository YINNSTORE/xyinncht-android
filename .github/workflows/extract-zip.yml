name: Extract ZIP Project

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "xyinncht-github-upload.zip"

permissions:
  contents: write

concurrency:
  group: extract-xyinncht-zip
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Check ZIP exists
        run: |
          test -f "xyinncht-github-upload.zip" || {
            echo "::error::File xyinncht-github-upload.zip tidak ditemukan di root repository."
            exit 1
          }

      - name: Extract project ZIP to repository root
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xyinncht-extract"
          unzip -oq "xyinncht-github-upload.zip" -d "$RUNNER_TEMP/xyinncht-extract"
          cp -a "$RUNNER_TEMP/xyinncht-extract/." .
          echo "ZIP berhasil diekstrak ke root repository."

      - name: Commit extracted project files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan baru untuk di-commit."
            exit 0
          fi
          git commit -m "Extract XyinnCht project ZIP"
          git push
