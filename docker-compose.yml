services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: xyinncht
      POSTGRES_PASSWORD: xyinncht
      POSTGRES_DB: xyinncht
    ports: ["5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  dbdata:
